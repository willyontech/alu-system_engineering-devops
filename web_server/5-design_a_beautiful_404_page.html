<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #202b45);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 650px;
        }

        h1 {
            font-size: 120px;
            color: #38bdf8;
            text-shadow: 0 0 30px #0284c7;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 14px 30px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #38bdf8;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 45px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Lost in Space?</h2>
        <p>
            Ceci n'est pas une page.<br>
            The page you're looking for doesn't exist
            or may have been moved.
        </p>
        <a href="/">Return to Homepage</a>
        <div class="footer">
            &copy; 2026 | Holberton School Web Server Project
        </div>
    </div>
</body>
</html>
